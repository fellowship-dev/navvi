name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Offline tests and build (Chromium)
    runs-on: ubuntu-latest
    env:
      # Tests use the browser installed below; GitHub already sets CI=true.
      NAVVI_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate actor browser image pins
        run: node scripts/check-image-pins.mjs
      - name: Validate the architecture diagram against the import graph
        run: node scripts/check-architecture.mjs
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check TypeScript in the tests
        run: npm run typecheck:tests
      - name: Run offline tests
        run: npm test
      - name: Build package and copy browser assets
        run: npm run build
  push-actor:
    # The beta build on Apify follows every green main; `latest` stays a manual promote.
    # Needs the APIFY_TOKEN repository secret; without it the job is skipped, not failed.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Apify token
        id: token
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: echo "present=$([ -n "$APIFY_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Push the beta build
        if: steps.token.outputs.present == 'true'
        uses: apify/push-actor-action@5cc259c1492e59394a1e3db984b966e16a3d026c # v1.1.4
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          build-tag: beta
